# VirtualService: routing rule untuk traffic ke order-service
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: order-service-vs
spec:
  hosts:
  - "*"
  gateways:
  - ecommerce-gateway
  http:
  - match:
    - uri:
        exact: /order    # Route hanya untuk path /order
    route:
    - destination:
        host: order-service   # Nama Service Kubernetes order-service
        port:
          number: 3000
