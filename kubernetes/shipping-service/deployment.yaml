# Deployment untuk Shipping Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  labels:
    app: shipping-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
    spec:
      containers:
      - name: shipping-service
        # Image dari Docker Hub
        image: symrizals/shipping-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        # URL RabbitMQ menggunakan nama Service Kubernetes (DNS internal)
        - name: AMQP_URL
          value: "amqp://guest:guest@rabbitmq:5672"
