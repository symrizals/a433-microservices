# Service untuk expose RabbitMQ ke dalam cluster
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672        # Port AMQP untuk koneksi aplikasi
    targetPort: 5672
  - name: management
    port: 15672       # Port Management UI
    targetPort: 15672
