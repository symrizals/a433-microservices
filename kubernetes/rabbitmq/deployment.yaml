# Deployment untuk RabbitMQ message broker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        # Image RabbitMQ dengan Management UI
        image: rabbitmq:3.11-management
        ports:
        - containerPort: 5672   # AMQP protocol
        - containerPort: 15672  # Management UI
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "guest"
        - name: RABBITMQ_DEFAULT_PASS
          value: "guest"
        # Health check: pastikan RabbitMQ siap sebelum service lain konek
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "ping"]
          initialDelaySeconds: 20
          periodSeconds: 10
