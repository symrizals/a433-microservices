# Docker Compose untuk E-Commerce App
# Menggunakan container image dari Docker Hub dan GitHub Packages
services:

  # Message broker untuk komunikasi async antar service
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Order Service: menerima order dari client dan publish ke RabbitMQ
  order-service:
    image: symrizals/order-service:latest   # Image dari Docker Hub
    container_name: order-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Shipping Service: consume order dari RabbitMQ dan proses pengiriman
  shipping-service:
    image: symrizals/shipping-service:latest  # Image dari Docker Hub
    container_name: shipping-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
